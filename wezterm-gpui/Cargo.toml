[package]
name = "wezterm-gpui"
version = "0.1.0"
authors = ["Wez Furlong <wez@wezfurlong.org>"]
edition = "2024"
publish = false
description = "GPUI proof-of-concept frontend for WezTerm (does not replace wezterm-gui)"

# Isolated workspace: cannot join the WezTerm root workspace while wezterm-gui
# still vendors `deps/freetype` (`links = "freetype"`). This crate uses GPUI's
# `freetype-sys` as the single FreeType in *this* graph (`wezterm-font` feature
# `sys-freetype`).
[workspace]

[dependencies]
anyhow = "1.0"
async-channel = "2.3"
# Do not put `rev` on these: gpui-component depends on the same git URL without
# `rev`. Mixing `?rev=` and unpinned git duplicates gpui in the graph.
# Zed SHA is pinned in Cargo.lock (see docs/STATE.json pins.gpui_rev).
gpui = { git = "https://github.com/zed-industries/zed", features = ["profiler"] }
gpui_platform = { git = "https://github.com/zed-industries/zed", features = ["font-kit"] }
gpui-component = { git = "https://github.com/longbridge/gpui-component", rev = "ff3eb1128ac1058f1bb88e777744ce1237aa3b79" }
# Same git/rev as gpui-component. IconName paths (`icons/plus.svg`, window
# min/max/close, …) are not embedded in gpui-component; without this +
# `with_assets`, every Icon is an empty box (028).
gpui-component-assets = { git = "https://github.com/longbridge/gpui-component", rev = "ff3eb1128ac1058f1bb88e777744ce1237aa3b79" }
# Same git/rev as gpui-component. Enables `gpui/profiler` for FrameTimingCollector.
# Do not pin a different rev — that duplicates gpui.
gpui-fps = { git = "https://github.com/longbridge/gpui-component", rev = "ff3eb1128ac1058f1bb88e777744ce1237aa3b79" }
# Same local-shell host as wezterm-gui (`mux` LocalDomain / LocalPane).
# wezterm-font uses GPUI's freetype-sys (`sys-freetype`); do not take
# wezterm-gui or window (event loop). cairo-sys is WezTerm's vendored cairo
# (no FreeType); required by wezterm-font COLR/recording surfaces.
config = { path = "../config" }
mux = { path = "../mux" }
portable-pty = { path = "../pty" }
promise = { path = "../promise" }
wezterm-bidi = { path = "../bidi" }
# sys-freetype: GPUI owns FreeType. vendor-jetbrains: same bundled face
# wezterm-gui ships (default config family is "JetBrains Mono"). Without it,
# GDI has nothing to load if that family is not installed, and paint falls
# back to Consolas GPUI text (`metrics_for_idx: there is no font with idx=0`).
wezterm-font = { path = "../wezterm-font", default-features = false, features = ["sys-freetype", "vendor-jetbrains"] }
wezterm-term = { path = "../term" }
# Owns `links = "freetype"` in this graph (same crate GPUI font-kit uses).
freetype-sys = "=0.20.1"
# GPUI RenderImage frames (same major as gpui's `image`).
image = "0.25"

[patch.crates-io]
cairo-sys-rs = { path = "../deps/cairo" }
