[package]
name = "wezterm-font"
version = "0.1.0"
authors = ["Wez Furlong <wez@wezfurlong.org>"]
edition = "2021"
publish = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = ["vendored-freetype", "native-fontconfig"]
# wezterm-gui: compile against vendored `deps/freetype` (`links = "freetype"`).
vendored-freetype = ["dep:freetype", "harfbuzz/vendored-freetype"]
# wezterm-gpui: compile against `freetype-sys` via `gpui-freetype` (GPUI owns FreeType).
sys-freetype = ["dep:gpui-freetype", "harfbuzz/sys-freetype"]
# Unix font locator. Off in wezterm-gpui so GPUI's fontconfig-sys can own `links = "fontconfig"`.
native-fontconfig = ["dep:fontconfig"]
vendor-jetbrains = []
vendor-roboto = []
vendor-noto-emoji = []
vendor-nerd-font-symbols = []

[dependencies]
anyhow.workspace = true
cairo-rs.workspace = true
config.workspace = true
encoding_rs.workspace = true
enum-display-derive.workspace = true
euclid.workspace = true
finl_unicode.workspace = true
freetype = { workspace = true, optional = true }
gpui-freetype = { path = "../deps/freetype-from-sys", optional = true }
harfbuzz = { path = "../deps/harfbuzz", default-features = false }
image.workspace = true
lazy_static.workspace = true
lfucache.workspace = true
log.workspace = true
memmap2.workspace = true
metrics.workspace = true
ordered-float.workspace = true
rangeset.workspace = true
termwiz.workspace = true
thiserror.workspace = true
walkdir.workspace = true
wezterm-bidi.workspace = true
wezterm-color-types.workspace = true
wezterm-input-types.workspace = true
wezterm-term = { workspace=true, features=["use_serde"] }
wezterm-toast-notification.workspace = true

[target.'cfg(any(target_os = "android", all(unix, not(target_os = "macos"))))'.dependencies]
fontconfig = { workspace = true, optional = true }

[target."cfg(windows)".dependencies]
dwrote.workspace = true
winapi.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
cocoa.workspace = true
core-foundation.workspace = true
core-text.workspace = true
objc.workspace = true

[dev-dependencies]
env_logger.workspace = true
k9.workspace = true
